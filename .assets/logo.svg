<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skills logo</title>
  <desc id="desc">A retro computer style Skills wordmark with a connected video game skill grid icon.</desc>
  <defs>
    <pattern id="scanlines" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
    <pattern id="pixel-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" stroke="#273646" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="wordmark" x1="292" y1="76" x2="702" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7D04A"/>
      <stop offset="0.35" stop-color="#C7FF6B"/>
      <stop offset="1" stop-color="#19F9B7"/>
    </linearGradient>
  </defs>

