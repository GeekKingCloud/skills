<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Skills social preview</title>
  <desc id="desc">A retro CRT social preview with the Skills logo above reusable workflow text.</desc>
  <defs>
    <pattern id="bg-scanlines" width="1" height="7" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
    <pattern id="bg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#243646" stroke-width="2" opacity="0.45"/>
    </pattern>
    <filter id="soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="logo-wordmark" x1="292" y1="76" x2="702" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7D04A"/>
      <stop offset="0.35" stop-color="#C7FF6B"/>
      <stop offset="1" stop-color="#19F9B7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#05070B"/>
